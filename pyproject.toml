[project]
name = "reportgenerator"
version = "0.1.0"
description = ""
authors = [
    {name = "afourneyron", email = "axel.fourneyron@lpo.fr"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-docx (>=1.2.0,<2.0.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "plotly (>=6.7.0,<7.0.0)",
    "kaleido (>=1.3.0,<2.0.0)",
    "geopandas (>=1.1.3,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)"
]

[tool.poetry.scripts]
reportgenerator = "reportgenerator.cli:main"

[tool.poetry]
packages = [{include = "reportgenerator", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]
