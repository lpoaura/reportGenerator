# Synthèse des données d'oiseaux dans le cadre d'un projet éolien.
# Process, contenu du rapport et règles : METHODO.md (à mettre à jour si une règle change).
#
# Fichiers du dossier :
#   template.docx               modèle Word (placeholders {{...}})
#   qgis/projet_eolien.qgs      projet QGIS modèle (+ projet_eolien_attachments.zip)

label = "Projet éolien - synthèse oiseaux et chiroptères"
template = "template.docx"
qgis_project = "qgis/projet_eolien.qgs"

# Valeurs du champ list_analyse (formulaire QGIS) qui déclenchent ce rapport, et les
# analyses optionnelles que chacune active. Sans déclencheur reconnu : rapport générique.
# Pour proposer plus tard un rapport sans chiroptères, ajouter par exemple :
#   analyse_eolien_oiseaux = []
[declencheurs]
analyse_eolien = ["chiropteres"]

[analyses]
# "cartography" s'exécute toujours en dernier (elle utilise les couches GPKG des autres briques)
required = [
    "socle_data",
    "projet_info",
    "perimetres_anneaux",
    "especes_enjeux_eolien",
    "vulnerabilite_eolien",  # indice de vulnérabilité MEDDE 2015 (§4.2 + annexe)
    "nidification",
    "passereaux",            # passereaux nicheurs au-dessus du seuil de vulnérabilité (tableau)
    "autres_nicheurs",       # autres espèces nicheuses à enjeux (tableau)
    "cartes_nidification",   # plan des cartes de nidification par groupe d'espèces (METHODO §5 bis)
    "dortoirs",
    "cartes_dortoirs",       # plan des cartes de dortoirs par groupe, zones fusionnées
    "migration",
    "cartes_migration",      # une carte de migration par espèce à vulnérabilité >= 4 (+ Milan royal)
    "couverture_cartes",     # contrôle : espèces de vulnérabilité >= 3 absentes des cartes thématiques
    "couches_qgis_eolien",   # couches vm_eolienne_* attendues par le projet QGIS modèle
    "connaissance",          # état des connaissances par maille de 1 km (briques communes)
    "couches_qgis_connaissance",
    "couches_cartes",        # couleurs par espèce, couche des cartes par groupe, liste des cartes pour le rendu
    "cartography",
    "connaissance_atlas",
    "cartes_word",           # cartes par groupe insérées dans le Word (après le rendu)
]
# chiropteres : section {{#chiropteres}} ... {{/chiropteres}} du template
optional = ["chiropteres"]

[params]
# --- socle de données (VM principale) ---
# Le champ buffer du formulaire n'est pas utilisé : l'emprise est fixée par les anneaux.
anneaux_km = [1, 6, 20]          # contours (donuts) : 0-1, 1-6, 6-20 km (validé)
annees = 10                      # depuis le 1er janvier de (année - 10), comme 03_vm_data.sql
groupes_taxo = ["Oiseaux", "Chauves-souris"]
chiro_rangs_non_especes = ["GN", "RES"]  # chiroptères : genres et complexes gardés (gîtes souvent non spécifiques)
grille = "M1"                    # mailles 1 km (état des connaissances, sensibilité)
statuts_validation = ["0", "1", "2"]  # comme le générique (décision) ; le R ne gardait que 1-2
sensibilite_eolien = true        # note 0-4 de partage.sensibilite_oiseaux
# Dédoublonnage entre sources (même taxon, même jour, même cellule de 100 m) : la première source
# présente de la liste est gardée. Ex. sur la zone de test : ~5 900 doublons faune-france / gn2pg_cen_auv.
sources_prioritaires = ["faune-france", "dbChiroGCRA"]
# Région couverte par la base : la part de l'aire d'étude hors région est signalée dans le texte
region_donnees = "AUVERGNE-RHONE-ALPES"   # area_name dans ref_geo.mv_fr_region
region_libelle = "Auvergne-Rhône-Alpes"

# --- espèces à enjeux (§4) ---
lr_regionale = "lr_aura"         # dernier script R ; "lr_auv" dans les versions précédentes
enjeux_lr_statuts = ["CR", "EN", "VU"]
enjeux_sensibilite_min = 2       # sensibilité > 2
nicheur_enjeux_lr_statuts = ["CR", "EN", "VU", "NT"]   # "enjeux forts" du §5.1

# --- indice de vulnérabilité (MEDDE 2015, METHODO §4 bis) ---
# Tableau principal, phrase de synthèse et sélection des passereaux : indice > seuil.
# Pour revenir à « >= 2,5 » (rapport de référence) : vulnerabilite_seuil_inclus = true
vulnerabilite_seuil = 2.5
vulnerabilite_seuil_inclus = false
vulnerabilite_phrases_min = 4    # phrases préremplies (distance, nidification la plus proche) : indice >= 4
vulnerabilite_carte_min = 3      # contrôle : ces espèces doivent figurer sur au moins une carte thématique

# --- chiroptères ---
chiro_referentiel = "ref_chiropteres.csv"   # NSE, NHab, rayon autour des gîtes, par espèce (cd_ref)
# classes de vulnérabilité (note minimale -> libellé), reprises du document chiroptères
chiro_seuils_ne = [[10, "Très forte"], [7, "Forte"], [5, "Moyenne"]]
chiro_seuils_nh = [[8, "Forte"], [5, "Moyenne"]]
# Période (transit…) non prise en compte pour l'instant (champ presque jamais renseigné).
# Pour l'activer : chiro_transit_classe_min = "Forte"  (+1 à la maille si transit d'une espèce >= Forte)
chiro_dist_gite_defaut_m = 1000           # rayon des tampons pour les taxons sans rayon (genres, complexes)
chiro_floutage_m = 0                      # 0 = position précise ; ex. 1000 = centre de la maille de 1 km

# --- état des connaissances par maille de 1 km (briques communes, cf. METHODO.md §3 bis) ---
connaissance_groupes = ["Oiseaux", "Chauves-souris"]   # chiroptères : si l'analyse est activée (sous-table)
connaissance_rayon_km = 6            # emprise des mailles : zone d'étude + 6 km (anneau intermédiaire)
pool_local_km = 20                   # référence : espèces du groupe connues sur toute l'aire d'étude (20 km)
connaissance_renvoi = "les tableaux d'espèces par anneau"
connaissance_niveau_titre = 2        # titres des groupes dans l'atlas (la partie est de niveau 1)

# --- cartes ---
# (les sous-tables [params.xxx] doivent rester en fin de fichier : tout ce qui les suit leur appartient)
map_layout = "page"             # carte dans le paragraphe du placeholder (1 page par carte dans le template)
zonage_rayon_km = 30             # zonages affichés sur la carte de localisation
tampons_statuts_nidif = ["Certain"]

# --- cartes par groupe d'espèces (nidification ; METHODO §5 bis) ---
# Groupes : [[params.groupes_cartes]] en fin de fichier. Couleurs : couleurs_especes.csv (une par cd_ref).
cartes_max_especes = 6           # au-delà, le groupe est découpé (lisibilité de la carte et de la légende)
couleurs_especes = "couleurs_especes.csv"
nidif_regroupement_m = 100       # données d'une espèce regroupées par maille de 100 m (point au centre des données)
nidif_annees_site = 3            # site (maille) occupé au moins 3 années : point grossi et cerclé de noir
# Dortoirs : mêmes groupes ; zones = tampons de ce rayon autour des données d'une espèce, fusionnés s'ils se touchent
# (750 m ≈ l'ancien rond de 8 mm de la carte 12 à l'échelle du rapport)
dortoirs_rayon_m = 750
# Migration : une carte par espèce migratrice d'indice de vulnérabilité >= ce seuil, plus les espèces de la liste
migration_cartes_vulnerabilite_min = 4
migration_cartes_especes = ["Milvus milvus"]

# Tampons autour des sites de nidification (km), par nom scientifique.
# Liste du template (§8.2). Le SQL R contenait en plus : Aquila chrysaetos,
# Gyps fulvus, Aegypius monachus, Neophron percnopterus (5 km), Circus pygargus (2,5 km)
# -> à ajouter ici si retenus, en mettant à jour le texte du §8.2.
[params.tampons_nidification_km]
"Milvus milvus" = 5
"Ciconia nigra" = 5
"Milvus migrans" = 2.5
"Circaetus gallicus" = 2.5
"Falco peregrinus" = 2.5
"Bubo bubo" = 2.5
"Circus cyaneus" = 2.5

# Rendu QGIS (repris de lancement_carte_qgis.py)
[params.qgis_render]
visible_groups = ["Zone_etude", "FDC"]
extent_layer = "LEGENDE_LIMITE"
extent_margin_ratio = 0.0
extent_offset_y_ratio = 0.05
dpi = 150

[params.qgis_render.layout_buffers_m]
Carte1_zone_localisation = 30000

# Style construit au rendu (une catégorie par valeur, légende dans l'ordre du 2e champ, couleur lue dans le 3e) :
# couche = [champ, ordre, couleur, accent (point grossi et cerclé de noir)]
[params.qgis_render.categories_dynamiques]
vm_eolienne_nidif_cartes = ["nom", "ordre_legende", "couleur", "site_pluriannuel"]
vm_eolienne_dortoirs_cartes = ["nom", "ordre_legende", "couleur"]
vm_eolienne_migration_especes = ["nom", "ordre_legende", "couleur"]

# Points écartés en anneau quand ils se superposent (distance en mm sur la carte)
[params.qgis_render.deplacement_mm]
vm_eolienne_nidif_cartes = 1.0     # environ 190 m : seulement les points vraiment superposés (colonies, lieux-dits)

# État des connaissances : groupe gardé seulement si l'analyse optionnelle est activée
[params.connaissance_groupes_analyse]
"Chauves-souris" = "chiropteres"

# Floutage des sites de nidification (m), par nom scientifique : point au centre d'une maille de cette taille
# (au lieu de nidif_regroupement_m). Cigogne noire : maille de 5 km (comme l'ancienne couche floutée).
[params.nidif_floutage_m]
"Ciconia nigra" = 5000

# Groupes des cartes, dans l'ordre de priorité : une espèce va dans le premier groupe dont une règle la reconnaît
# (ordres, familles, genres ou especes = noms scientifiques). Au-delà de cartes_max_especes, le groupe est découpé
# selon ses sous-groupes [[...decoupage]] s'il en a, sinon en gardant les genres ensemble. Les espèces d'aucun groupe
# vont sur la carte « Autres ». section : sous-partie du rapport où la carte est insérée.
[[params.groupes_cartes]]
cle = "nocturnes"
titre = "rapaces nocturnes"
section = "rapaces"
ordres = ["Strigiformes"]
  [[params.groupes_cartes.decoupage]]
  cle = "hiboux"
  titre = "hiboux"
  genres = ["Bubo", "Asio", "Otus"]
  [[params.groupes_cartes.decoupage]]
  cle = "chouettes"
  titre = "chouettes"
  genres = ["Strix", "Athene", "Glaucidium", "Aegolius", "Tyto"]

[[params.groupes_cartes]]
cle = "buses_faucons"
titre = "buses et faucons"
section = "rapaces"
genres = ["Buteo", "Falco"]

[[params.groupes_cartes]]
cle = "milans_busards"
titre = "milans et busards"
section = "rapaces"
genres = ["Milvus", "Circus"]

[[params.groupes_cartes]]
cle = "vautours"
titre = "vautours"
section = "rapaces"
genres = ["Gyps", "Aegypius", "Neophron", "Gypaetus"]

[[params.groupes_cartes]]
cle = "diurnes"
titre = "autres rapaces diurnes"
section = "rapaces"
ordres = ["Accipitriformes", "Falconiformes"]
  [[params.groupes_cartes.decoupage]]
  cle = "aigles"
  titre = "aigles, circaète et balbuzard"
  genres = ["Aquila", "Hieraaetus", "Clanga", "Haliaeetus", "Circaetus", "Pandion"]
  [[params.groupes_cartes.decoupage]]
  cle = "eperviers"
  titre = "autour, épervier, bondrée et élanion"
  genres = ["Accipiter", "Astur", "Pernis", "Elanus"]

[[params.groupes_cartes]]
cle = "larides"
titre = "mouettes, goélands et sternes"
section = "grands_voiliers"
familles = ["Laridae", "Sternidae"]

[[params.groupes_cartes]]
cle = "cigognes"
titre = "cigognes et grues"
section = "grands_voiliers"
familles = ["Ciconiidae", "Gruidae"]

[[params.groupes_cartes]]
cle = "herons"
titre = "hérons et aigrettes"
section = "grands_voiliers"
familles = ["Ardeidae"]

[[params.groupes_cartes]]
cle = "canards"
titre = "canards, grèbes et cormorans"
section = "autres"
familles = ["Anatidae", "Podicipedidae", "Phalacrocoracidae"]

[[params.groupes_cartes]]
cle = "limicoles"
titre = "limicoles"
section = "autres"
familles = ["Charadriidae", "Scolopacidae", "Recurvirostridae", "Burhinidae", "Haematopodidae"]

[[params.groupes_cartes]]
cle = "rallides"
titre = "râles, marouettes et foulques"
section = "autres"
familles = ["Rallidae"]

[[params.groupes_cartes]]
cle = "passereaux"
titre = "passereaux à enjeux"
section = "passereaux"
ordres = ["Passeriformes"]
  [[params.groupes_cartes.decoupage]]
  cle = "pies_grieches"
  titre = "pies-grièches"
  familles = ["Laniidae"]
  [[params.groupes_cartes.decoupage]]
  cle = "bruants"
  titre = "bruants"
  familles = ["Emberizidae"]
  [[params.groupes_cartes.decoupage]]
  cle = "alouettes_pipits"
  titre = "alouettes, pipits et bergeronnettes"
  familles = ["Alaudidae", "Motacillidae"]
  [[params.groupes_cartes.decoupage]]
  cle = "fauvettes"
  titre = "fauvettes, pouillots et rousserolles"
  familles = ["Sylviidae", "Phylloscopidae", "Acrocephalidae", "Locustellidae", "Cisticolidae"]
  [[params.groupes_cartes.decoupage]]
  cle = "traquets_gobemouches"
  titre = "traquets, monticoles, gobemouches et grives"
  familles = ["Muscicapidae", "Turdidae"]
  [[params.groupes_cartes.decoupage]]
  cle = "fringilles"
  titre = "fringilles et moineaux"
  familles = ["Fringillidae", "Passeridae"]
  [[params.groupes_cartes.decoupage]]
  cle = "corvides"
  titre = "crave, chocard et autres corvidés"
  familles = ["Corvidae"]
